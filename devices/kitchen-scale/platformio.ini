; Gedara kitchen scale — ESP32-S3 DevKitC-1 + HX711 + RC522 + SSD1306 + MAX98357A (Phase 6b).
; docs/kitchen-scale/setup.md has the click-by-click steps. Environments:
;   s3       the real scale (all hardware connected)
;   s3_fake  a bare DevKit on USB: simulated load cell + tags driven from the Serial Monitor
;   native   unit tests of the weighing logic on the PC (needs a host C++ compiler)

[platformio]
default_envs = s3

[common]
lib_deps_hw =
  olikraus/U8g2 @ ^2.36.5
  tzapu/WiFiManager @ ^2.0.17
  bblanchon/ArduinoJson @ ^7.4.2
  miguelbalboa/MFRC522 @ ^1.4.12

[env:s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_8mb.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = ${common.lib_deps_hw}
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DARDUINO_USB_CDC_ON_BOOT=0
  -Wall
build_src_flags = -Wextra
; OTA rollback is done by the firmware itself (src/ota.cpp: boot counter + "must reach Gedara within
; 2 minutes"), so the prebuilt Arduino bootloader is enough — no slow custom ESP-IDF build.

[env:s3_fake]
extends = env:s3
build_flags =
  ${env:s3.build_flags}
  -DGEDARA_FAKE=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; Only the pure libraries (lib/weighing, lib/outbox_codec, lib/speech) are built for the PC.
build_src_filter = -<*>
lib_compat_mode = off
