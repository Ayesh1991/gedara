; Gedara bin scanner — NodeMCU ESP32 (ESP-WROOM-32, 4 MB) + GM861S + 4×4 keypad + SSD1306 + buzzer
; (Phase 11). docs/bin-scanner/setup.md has the click-by-click steps. Environments:
;   esp32       the real scanner (all hardware connected)
;   esp32_fake  a bare board on USB: scans and key presses typed in the Serial Monitor
;   native      unit tests of the logic on the PC (needs a host C++ compiler)

[platformio]
default_envs = esp32

; Every environment: code shared with the kitchen scale (certificates, log buffer, updater, CRC +
; sequence numbers).
[env]
lib_extra_dirs = ../shared/lib

[common]
lib_deps_hw =
  olikraus/U8g2 @ ^2.36.5
  tzapu/WiFiManager @ ^2.0.17
  bblanchon/ArduinoJson @ ^7.4.2

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = ${common.lib_deps_hw}
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -Wall
build_src_flags = -Wextra
; OTA rollback is done by the shared updater itself (boot counter + "must reach Gedara within
; 2 minutes"), so the prebuilt Arduino bootloader is enough.

[env:esp32_fake]
extends = env:esp32
build_flags =
  ${env:esp32.build_flags}
  -DGEDARA_FAKE=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; Only the pure libraries (lib/binlogic, ../shared/lib/gedara_core) are built for the PC.
build_src_filter = -<*>
lib_compat_mode = off
