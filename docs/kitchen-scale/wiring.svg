<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">
  <title>Gedara kitchen scale — wiring (ESP32-S3 DevKitC-1)</title>
  <defs>
    <style>
      .bg { fill: #05070F; }
      .panel { fill: #0E1426; stroke: #2A3557; stroke-width: 1.5; }
      .board { fill: #101A33; stroke: #6C7BD8; stroke-width: 2; }
      .h { fill: #E8ECF8; font-size: 18px; font-weight: 600; }
      .t { fill: #C5CCE3; font-size: 13px; }
      .m { fill: #8A94B8; font-size: 12px; }
      .pin { fill: #E8ECF8; font-size: 12px; font-family: IBM Plex Mono, Consolas, monospace; }
      .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .v5 { stroke: #FF6B6B; }
      .v3 { stroke: #F5B83D; }
      .gnd { stroke: #6B7280; stroke-dasharray: 6 4; }
      .hx { stroke: #F472B6; }
      .spi { stroke: #A78BFA; }
      .i2c { stroke: #22D3EE; }
      .i2s { stroke: #2FC6A0; }
      .btn { stroke: #E8ECF8; }
      .warn { fill: #F5B83D; font-size: 12.5px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="900"/>
  <text x="40" y="44" class="h" font-size="24">Gedara kitchen scale · wiring</text>
  <text x="40" y="68" class="m">ESP32-S3 DevKitC-1 · all signal lines 3.3 V · amplifier VIN 5 V · pins checked against the ESP32-S3 datasheet (docs/kitchen-scale/pins.md)</text>

  <!-- ESP32-S3 board -->
  <rect class="board" x="470" y="140" width="260" height="600" rx="14"/>
  <text x="600" y="170" class="h" text-anchor="middle">ESP32-S3 DevKitC-1</text>
  <text x="600" y="190" class="m" text-anchor="middle">USB-C “UART” → 5 V 2 A adapter</text>
  <g class="pin">
    <text x="482" y="240">3V3</text>
    <text x="482" y="300">GPIO 4  · HX DT</text>
    <text x="482" y="330">GPIO 5  · HX SCK</text>
    <text x="482" y="620">GPIO 1  · SDA</text>
    <text x="482" y="640">GPIO 2  · SCL</text>
    <text x="482" y="560">GPIO 14 · button</text>
    <text x="482" y="710">GND</text>
  </g>
  <g class="pin" text-anchor="end">
    <text x="718" y="240">5V</text>
    <text x="718" y="290">SS · GPIO 10</text>
    <text x="718" y="315">MOSI · GPIO 11</text>
    <text x="718" y="340">SCK · GPIO 12</text>
    <text x="718" y="365">MISO · GPIO 13</text>
    <text x="718" y="390">RST · GPIO 9</text>
    <text x="718" y="480">BCLK · GPIO 6</text>
    <text x="718" y="505">LRC · GPIO 7</text>
    <text x="718" y="530">DIN · GPIO 15</text>
    <text x="718" y="555">SD · GPIO 16</text>
    <text x="718" y="710">GND</text>
  </g>
  <text x="600" y="414" class="m" text-anchor="middle">BOOT button = GPIO 0</text>
  <text x="600" y="430" class="m" text-anchor="middle">(same job as the external button;</text>
  <text x="600" y="446" class="m" text-anchor="middle">only read after start-up)</text>

  <!-- HX711 -->
  <rect class="panel" x="60" y="200" width="250" height="220" rx="12"/>
  <text x="80" y="228" class="h">HX711</text>
  <g class="pin"><text x="80" y="256">VCC</text><text x="80" y="300">DT</text><text x="80" y="330">SCK</text><text x="80" y="350">GND</text></g>
  <text x="80" y="374" class="m">E+ red · E− black · A− white · A+ green</text>
  <text x="80" y="404" class="warn">VCC from 3V3, not 5 V</text>
  <path class="w v3" d="M 112 252 L 330 252 L 330 236 L 470 236"/>
  <path class="w hx" d="M 104 296 L 470 296"/>
  <path class="w hx" d="M 112 326 L 470 326"/>
  <!-- load cell -->
  <rect class="panel" x="60" y="440" width="250" height="70" rx="12"/>
  <text x="80" y="468" class="h">5 kg load cell</text>
  <text x="80" y="490" class="m">4 wires → HX711 E± / A±, twisted</text>
  <path class="w hx" d="M 185 420 L 185 440"/>

  <!-- Button -->
  <rect class="panel" x="60" y="530" width="250" height="60" rx="12"/>
  <text x="80" y="556" class="h">Push button</text>
  <text x="80" y="576" class="m">optional · GPIO 14 ↔ button ↔ GND</text>
  <path class="w btn" d="M 310 556 L 470 556"/>

  <!-- OLED -->
  <rect class="panel" x="60" y="610" width="250" height="110" rx="12"/>
  <text x="80" y="636" class="h">OLED 0.96" SSD1306</text>
  <text x="80" y="654" class="m">I²C address 0x3C</text>
  <g class="pin"><text x="80" y="676">VCC 3V3</text><text x="80" y="696">SDA</text><text x="80" y="714">SCL</text></g>
  <path class="w i2c" d="M 112 692 L 400 692 L 400 616 L 470 616"/>
  <path class="w i2c" d="M 112 710 L 420 710 L 420 636 L 470 636"/>
  <path class="w v3" d="M 150 672 L 350 672 L 350 236"/>

  <!-- RC522 -->
  <rect class="panel" x="890" y="200" width="270" height="230" rx="12"/>
  <text x="910" y="228" class="h">RFID-RC522 (13.56 MHz)</text>
  <g class="pin"><text x="910" y="256">3.3V</text><text x="910" y="286">SDA/SS</text><text x="910" y="311">MOSI</text><text x="910" y="336">SCK</text><text x="910" y="361">MISO</text><text x="910" y="386">RST</text></g>
  <text x="1010" y="256" class="m">IRQ: not connected</text>
  <text x="910" y="414" class="warn">3.3 V only · under the plate, not touching it</text>
  <path class="w spi" d="M 730 286 L 890 286"/>
  <path class="w spi" d="M 730 311 L 890 311"/>
  <path class="w spi" d="M 730 336 L 890 336"/>
  <path class="w spi" d="M 730 361 L 890 361"/>
  <path class="w spi" d="M 730 386 L 890 386"/>
  <path class="w v3" d="M 900 252 L 860 252 L 860 210 L 340 210 L 340 236"/>

  <!-- MAX98357A -->
  <rect class="panel" x="890" y="460" width="270" height="170" rx="12"/>
  <text x="910" y="488" class="h">MAX98357A I²S amp</text>
  <g class="pin"><text x="910" y="512">VIN 5 V</text><text x="910" y="537">BCLK</text><text x="910" y="562">LRC</text><text x="910" y="587">DIN</text><text x="910" y="612">SD</text></g>
  <text x="1010" y="512" class="m">+ 1000 µF to GND</text>
  <text x="980" y="612" class="m">high = on · GAIN open</text>
  <path class="w i2s" d="M 730 476 L 820 476 L 820 533 L 890 533"/>
  <path class="w i2s" d="M 730 501 L 810 501 L 810 558 L 890 558"/>
  <path class="w i2s" d="M 730 526 L 800 526 L 800 583 L 890 583"/>
  <path class="w i2s" d="M 730 551 L 790 551 L 790 608 L 890 608"/>
  <path class="w v5" d="M 730 236 L 840 236 L 840 508 L 890 508"/>
  <rect class="panel" x="890" y="660" width="270" height="60" rx="12"/>
  <text x="910" y="686" class="h">Speaker 4–8 Ω, 2–3 W</text>
  <text x="910" y="706" class="m">wires away from the HX711</text>
  <path class="w i2s" d="M 1060 630 L 1060 660"/>

  <!-- Ground -->
  <path class="w gnd" d="M 470 706 L 445 706 L 445 790 L 1180 790 L 1180 620 L 1160 620"/>
  <path class="w gnd" d="M 730 706 L 760 706 L 760 790"/>
  <path class="w gnd" d="M 112 346 L 40 346 L 40 790 L 445 790"/>
  <path class="w gnd" d="M 1160 420 L 1180 420 L 1180 620"/>
  <path class="w gnd" d="M 60 576 L 40 576"/>
  <path class="w gnd" d="M 60 660 L 40 660"/>
  <text x="600" y="812" class="m" text-anchor="middle">GND: one star point on the board; every module's GND goes there</text>

  <!-- Legend -->
  <g transform="translate(40,852)">
    <path class="w v5" d="M 0 0 L 30 0"/><text x="38" y="4" class="t">5 V</text>
    <path class="w v3" d="M 90 0 L 120 0"/><text x="128" y="4" class="t">3.3 V</text>
    <path class="w gnd" d="M 190 0 L 220 0"/><text x="228" y="4" class="t">GND</text>
    <path class="w hx" d="M 290 0 L 320 0"/><text x="328" y="4" class="t">HX711 / load cell</text>
    <path class="w spi" d="M 460 0 L 490 0"/><text x="498" y="4" class="t">SPI (RC522)</text>
    <path class="w i2c" d="M 600 0 L 630 0"/><text x="638" y="4" class="t">I²C (OLED)</text>
    <path class="w i2s" d="M 740 0 L 770 0"/><text x="778" y="4" class="t">I²S (amplifier)</text>
    <path class="w btn" d="M 900 0 L 930 0"/><text x="938" y="4" class="t">button</text>
  </g>
</svg>
