<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">
  <title>Gedara print server — architecture (Raspberry Pi 2 + Epson L3110)</title>
  <defs>
    <style>
      .bg { fill: #05070F; }
      .panel { fill: #0E1426; stroke: #2A3557; stroke-width: 1.5; }
      .pi { fill: #101A33; stroke: #6C7BD8; stroke-width: 2; }
      .inner { fill: #0B1122; stroke: #2A3557; stroke-width: 1.2; }
      .h { fill: #E8ECF8; font-size: 18px; font-weight: 600; }
      .t { fill: #C5CCE3; font-size: 13px; }
      .m { fill: #8A94B8; font-size: 12px; }
      .mono { fill: #E8ECF8; font-size: 12.5px; font-family: IBM Plex Mono, Consolas, monospace; }
      .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lan { stroke: #8A94B8; }
      .wifi { stroke: #8A94B8; stroke-dasharray: 2 7; }
      .phone { stroke: #22D3EE; }
      .pc { stroke: #F5B83D; }
      .usb { stroke: #2FC6A0; }
      .lbl-phone { fill: #22D3EE; font-size: 12.5px; font-weight: 600; }
      .lbl-pc { fill: #F5B83D; font-size: 12.5px; font-weight: 600; }
      .lbl-usb { fill: #2FC6A0; font-size: 12.5px; font-weight: 600; }
      .warn { fill: #F5B83D; font-size: 12.5px; font-weight: 600; }
    </style>
    <marker id="a-phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="a-pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F5B83D"/></marker>
    <marker id="a-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2FC6A0"/></marker>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="40" y="44" class="h" font-size="24">Gedara print server · how it fits together</text>
  <text x="40" y="68" class="m">Phase 7g · Raspberry Pi 2 shares the Epson L3110 on the home network · no Gedara keys on the Pi · nothing reachable from the internet</text>

  <!-- Router -->
  <rect class="panel" x="470" y="100" width="260" height="70" rx="14"/>
  <text x="600" y="130" class="h" text-anchor="middle">Home router</text>
  <text x="600" y="152" class="m" text-anchor="middle">Wi-Fi · DHCP (reserve the Pi's address)</text>

  <!-- Raspberry Pi -->
  <rect class="pi" x="60" y="250" width="520" height="380" rx="16"/>
  <text x="84" y="282" class="h">Raspberry Pi 2 · “gedara-print”</text>
  <text x="84" y="302" class="m">Raspberry Pi OS Lite 32-bit · set up by devices/print-server/setup.sh</text>

  <rect class="inner" x="84" y="322" width="472" height="58" rx="10"/>
  <text x="100" y="346" class="t">avahi (mDNS) — announces “Epson L3110 (Gedara)”</text>
  <text x="100" y="366" class="m">so iPhone, iPad and Android find it by themselves</text>

  <rect class="inner" x="84" y="482" width="226" height="128" rx="10"/>
  <text x="100" y="506" class="mono">CUPS queue L3110</text>
  <text x="100" y="528" class="t">shared · IPP port 631</text>
  <text x="100" y="548" class="m">PDF / photo → cups-filters</text>
  <text x="100" y="566" class="m">→ Epson ESC/P-R driver</text>
  <text x="100" y="588" class="m">A4 · retries if printer is off</text>

  <rect class="inner" x="330" y="482" width="226" height="128" rx="10"/>
  <text x="346" y="506" class="mono">CUPS queue L3110_raw</text>
  <text x="346" y="528" class="t">not shared · port 9100</text>
  <text x="346" y="548" class="m">the PC's Epson driver already</text>
  <text x="346" y="566" class="m">made the page: passed through</text>
  <text x="346" y="588" class="m">untouched · retries if off</text>

  <rect class="inner" x="84" y="392" width="472" height="78" rx="10"/>
  <text x="100" y="416" class="t">ufw firewall: SSH 22, IPP 631, 9100, mDNS — home network only</text>
  <text x="100" y="436" class="t">automatic updates · CUPS restarts itself · no Gedara keys</text>
  <text x="100" y="456" class="m">install.ps1 on the PC updates it over SSH (key made by the script, never shown)</text>

  <!-- Phones -->
  <rect class="panel" x="800" y="250" width="340" height="150" rx="14"/>
  <text x="824" y="282" class="h">iPhone · iPad · Android</text>
  <text x="824" y="306" class="t">Gedara → Places → Print labels → PDF</text>
  <text x="824" y="326" class="t">→ Share → Print → “Epson L3110 (Gedara)”</text>
  <text x="824" y="352" class="m">iOS: AirPrint · Android: built-in print service</text>
  <text x="824" y="372" class="m">(Mopria plug-in if the printer doesn't appear)</text>

  <!-- PC -->
  <rect class="panel" x="800" y="450" width="340" height="150" rx="14"/>
  <text x="824" y="482" class="h">Windows PC</text>
  <text x="824" y="506" class="t">Word, PDFs, any program → “EPSON L3110</text>
  <text x="824" y="526" class="t">(Gedara Pi)” with the usual Epson driver</text>
  <text x="824" y="552" class="m">Standard TCP/IP port → Pi:9100 (raw)</text>
  <text x="824" y="572" class="m">Properties window unchanged · PC can be off for phones</text>

  <!-- Printer -->
  <rect class="panel" x="190" y="700" width="260" height="80" rx="14"/>
  <text x="320" y="732" class="h" text-anchor="middle">Epson L3110</text>
  <text x="320" y="754" class="m" text-anchor="middle">USB cable moved from the PC to the Pi</text>

  <!-- Network links -->
  <path class="w lan" d="M600 170 V210 H320 V250"/>
  <text x="330" y="232" class="m">LAN cable (recommended) or USB Wi-Fi dongle</text>
  <path class="w wifi" d="M600 170 V210 H970 V250"/>
  <text x="980" y="232" class="m">Wi-Fi</text>
  <path class="w wifi" d="M730 135 H1170 V525 H1140"/>
  <text x="1060" y="128" class="m">Wi-Fi / LAN</text>

  <!-- Print paths -->
  <path class="w phone" d="M800 300 H640 V476 H197 V479" marker-end="url(#a-phone)"/>
  <text x="720" y="292" class="lbl-phone" text-anchor="middle">IPP :631 (PDF)</text>
  <path class="w pc" d="M800 525 H680 V546 H559" marker-end="url(#a-pc)"/>
  <text x="620" y="538" class="lbl-pc" text-anchor="middle">:9100</text>
  <path class="w usb" d="M200 610 V660 H300 V697" marker-end="url(#a-usb)"/>
  <path class="w usb" d="M440 610 V660 H340 V697" marker-end="url(#a-usb)"/>
  <text x="460" y="660" class="lbl-usb">USB</text>

  <text x="600" y="800" class="warn" text-anchor="middle">Over the network the Epson Maintenance tab (nozzle check, head cleaning) may not work — use the printer's buttons or plug the USB back into the PC for that.</text>
</svg>
